[project]
name = "ai-court-backend"
version = "0.2.0"
description = "AI 법정 백엔드: 재판 도메인(court)과 API 서버(app)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
